name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Logic tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # tests/test_logic.py replaces YOLO with a fake detector, so it only
        # needs numpy + OpenCV. Installing the full requirements.txt here would
        # pull in torch and PySide6 and add many minutes to every run.
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless

      - name: Run logic tests
        run: python -m tests.test_logic
